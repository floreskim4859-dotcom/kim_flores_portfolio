<section class="projects-section" id="projects" aria-labelledby="projects-title">
  <div class="section-wrap">
    <div class="projects-heading">
      <div>
        <p class="eyebrow">SELECTED WORK <span class="heading-rule"></span> 05</p>
        <h2 id="projects-title">A few things <span>I've made.</span></h2>
      </div>
      <p class="projects-intro">A growing collection of experiments, ideas, and things made useful.</p>
    </div>
    <div class="project-grid">
      @for (project of projects; track project.number) {
        <article class="project-card">
          <div class="project-image-wrap">
            <img [src]="'https://images.unsplash.com/' + project.image + '?auto=format&fit=crop&w=1000&q=85'" [alt]="project.type + ' project preview'" loading="lazy" />
            <span class="project-open" aria-hidden="true">↗</span>
          </div>
          <div class="project-meta"><span>{{ project.number }} / SELECTED WORK</span><span>{{ project.type }}</span></div>
          <h3>{{ project.title }}</h3>
        </article>
      }
    </div>
  </div>
</section>
